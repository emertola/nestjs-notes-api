services:
  db:
    image: postgres:17
    container_name: notes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_pass
      POSTGRES_DB: notes_db
    ports:
      - '5432:5432'
    volumes:
      - notes_pgdata:/var/lib/postgresql/data

volumes:
  notes_pgdata: